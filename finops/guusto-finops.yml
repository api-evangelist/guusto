meters:
- name: sender_seats
  description: Per-seat monthly subscription for users who send rewards.
  unit: seats
  aggregation: sum
  dimensions:
  - workspace
  - plan
- name: recipient_seats
  description: Per-seat monthly subscription for users who can receive rewards.
  unit: seats
  aggregation: sum
  dimensions:
