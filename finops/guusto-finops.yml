description: >-
  FinOps view of Guusto spend. Guusto cost has two distinct components: (1) the
  platform subscription, a per-seat SaaS fee (sender and recipient seats) across
  the Free, Lite, Essential, and Premium tiers, with API access included only on
  Premium; and (2) reward funding, the face value of gifts actually sent, which
  is funded separately and drawn down from workspace and member budgets. The
  Gifts API does not carry its own usage fee - it drives the same reward budget
  you fund - so API-driven cost is really gift spend, observable through the
  Account Budget and Reports APIs.
notes: >-
  Per-unit reward funding is customer-directed (the amount loaded per gift, 1 to
  10000), so gift spend is a variable cost distinct from the fixed per-seat
  subscription. Verify current seat rates and minimums on the Guusto pricing
  page during reconciliation.
