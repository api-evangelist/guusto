principles:
- name: Visibility
  description: >-
    Track seat counts against plan minimums and monitor reward budget drawdown
    per workspace and member via the Account Budget and Reports APIs.
- name: Allocation
  description: >-
    Attribute gift spend to teams and members using employee numbers and the
    team activity report so recognition cost maps to internal cost centers.
- name: Optimization
  description: >-
    Right-size sender vs recipient seats to the plan minimum, and set budgets
    and approvals (Premium) to keep gift funding within plan.
- name: Accountability
  description: >-
    Assign budget owners per workspace and review monthly seat spend plus gift
    funding against the recognition program budget.
