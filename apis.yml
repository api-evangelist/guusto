name: Guusto
kind: company
description: Guusto is an employee recognition and rewards platform that lets teams
  send digital gifts, run peer-to-peer and top-down recognition programs, and
  redeem rewards with 60,000+ merchant locations, prepaid Mastercard, and charitable
  donations. Guusto exposes a REST Gifts API - available on the Premium plan - for
  programmatically ordering gifts, tracking order status, retrieving workspace and
  member reward budgets, and pulling recognition activity and manager insight
  reports. Requests are authenticated with a Bearer API token plus an X-Workspace-id
  header against production (api.guusto.com) or a demo test environment
  (api-demo.guusto.io).
